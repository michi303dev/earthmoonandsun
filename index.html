<html lang="ja">
<head>
  <meta charset="utf-8">

  <title>earthmoonandsun — Version 0.1</title>
  <link rel="stylesheet" href="style.css">

<body>
  <main>
    <canvas aria-label="中央の太陽の周囲を地球が6秒で公転し、月が地球の周囲を約0.45秒で公転します。青と白の軌跡は実際に移動した跡です。"></canvas>
    <header><h1>earthmoonandsun</h1><span>VERSION 0.1</span></header>

      <span class="sun">Sun</span><span class="earth">Earth <small>6 s</small></span><span class="moon">Moon <small>0.45 s</small></span>
    </footer>
  </main>
